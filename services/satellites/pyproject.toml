[project]
name = "digitalearth-satellites"
version = "0.1.0"
description = "Public satellite GP data, C++ SGP4 propagation and persistent trajectory API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.2",
    "minio>=7.2.20",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "playwright>=1.65.2",
    "sgp4>=2.27",
    "ziglang>=0.17.1",
]
