name: digitalearth-satellites
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${ORBIT_DB_NAME}
      POSTGRES_USER: ${ORBIT_DB_USER}
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD}
    ports: ["127.0.0.1:${ORBIT_DB_PORT:-55433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  objects:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ORBIT_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${ORBIT_MINIO_PASSWORD}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
    external: true
    name: ${SATELLITES_POSTGRES_VOLUME:-digitalearth-satellites-postgres-data}
  minio-data:
    external: true
    name: ${SATELLITES_MINIO_VOLUME:-digitalearth-satellites-minio-data}
